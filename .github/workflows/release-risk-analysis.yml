name: Release Risk & Compatibility Analysis

# Runs when a release is published (pre-release or latest) and analyzes the
# release's signed zip package. The pipeline only downloads the latest package
# and the one before it; an LLM-based agent (Claude Opus 4.8) then drives an MCP
# server of evidence-collection & analysis tools plus a reusable skill to
# enumerate the available detection technologies, gather evidence about every
# binary (signing certificate, PE/.NET metadata, Rust/native binaries, OS
# imports, Rust compiler / OS supportability, diff vs. the previous release),
# produce a structured, schema-validated risk assessment, persist the result
# under analysis/, and regenerate the aggregate dashboard under docs/.

on:
  release:
    types: [published, released, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to analyze (for manual / back-fill runs)."
        required: true
        type: string

# Only one analysis per tag at a time; re-publishes of the same tag are coalesced.
concurrency:
  group: release-analysis-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write # commit analysis results + dashboard back to the repo

jobs:
  analyze:
    # Signing inspection is highest-fidelity on Windows (Get-AuthenticodeSignature).
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Provides `rustc -vV` (release, host triple, LLVM) so the Rust
      # supportability check can cross-reference the compiler against OS info.
      - name: Set up Rust toolchain (for rustc/OS supportability info)
        uses: dtolnay/rust-toolchain@stable

      - name: Install script dependencies
        shell: bash
        run: python -m pip install --upgrade pip && pip install -r scripts/requirements.txt

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Fetch this release's metadata (works for both release + dispatch events).
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > release.json
          PRERELEASE=$(jq -r '.prerelease' release.json)
          NAME=$(jq -r '.name // .tag_name' release.json)
          PUBLISHED=$(jq -r '.published_at // empty' release.json)
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

          # Save the release body (change list) to a file for the tools.
          jq -r '.body // ""' release.json > release-body.md

          # Deterministically pick the previous release (by published date) as baseline.
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          PREV_TAG=$(jq -r --arg tag "$TAG" '
            [ .[] | select(.tag_name != $tag) ]
            | sort_by(.published_at) | reverse | .[0].tag_name // empty' releases.json)
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Analyzing $TAG (prerelease=$PRERELEASE), baseline=${PREV_TAG:-none}"

      # The pipeline only downloads the two packages (latest + the one before);
      # all evidence gathering is delegated to the agent via the MCP server.
      - name: Download current release zip assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/current work/current_zip
          mapfile -t URLS < <(jq -r '.assets[] | select(.name | endswith(".zip")) | .url' release.json)
          if [ "${#URLS[@]}" -eq 0 ]; then
            echo "::warning::No .zip asset found on release ${{ steps.meta.outputs.tag }}"
          fi
          for url in "${URLS[@]}"; do
            fname=$(basename "$url")
            gh api -H "Accept: application/octet-stream" "$url" > "work/current_zip/${fname}.zip"
          done

      - name: Download previous release zip assets
        if: steps.meta.outputs.previous_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/previous work/previous_zip
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${{ steps.meta.outputs.previous_tag }}" > prev-release.json
          mapfile -t URLS < <(jq -r '.assets[] | select(.name | endswith(".zip")) | .url' prev-release.json)
          for url in "${URLS[@]}"; do
            fname=$(basename "$url")
            gh api -H "Accept: application/octet-stream" "$url" > "work/previous_zip/${fname}.zip"
          done

      - name: Unpack zip packages
        shell: bash
        run: |
          set -euo pipefail
          for z in work/current_zip/*.zip; do
            [ -e "$z" ] || continue
            unzip -o -q "$z" -d work/current
          done
          if [ -d work/previous_zip ]; then
            for z in work/previous_zip/*.zip; do
              [ -e "$z" ] || continue
              unzip -o -q "$z" -d work/previous
            done
          fi

      # The agent (Claude Opus 4.8) loads the skill, connects to the evidence MCP
      # server, enumerates the available detection technologies, inspects both
      # packages (incl. the Rust compiler / OS supportability check) and emits the
      # schema-validated report. Falls back to deterministic evidence-only output
      # when no ANTHROPIC_API_KEY is available.
      - name: Run agentic risk analysis (Claude Opus 4.8 + MCP + skill)
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVIDENCE_CURRENT_DIR: work/current
          EVIDENCE_PREVIOUS_DIR: ${{ steps.meta.outputs.previous_tag != '' && 'work/previous' || '' }}
          EVIDENCE_TAG: ${{ steps.meta.outputs.tag }}
          EVIDENCE_PREVIOUS_TAG: ${{ steps.meta.outputs.previous_tag }}
          EVIDENCE_RELEASE_NAME: ${{ steps.meta.outputs.name }}
          EVIDENCE_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          EVIDENCE_PUBLISHED_AT: ${{ steps.meta.outputs.published }}
          EVIDENCE_BODY_FILE: release-body.md
          EVIDENCE_RELEASE_NOTES_DIR: release-notes
        run: |
          set -euo pipefail
          python scripts/agent_runner.py \
            --schema schema/analysis.schema.json \
            --skill skills/release-risk-analysis/SKILL.md \
            --mcp-server mcp_server/evidence_mcp_server.py \
            --model claude-opus-4-8 \
            --output "analysis/${{ steps.meta.outputs.tag }}.json" \
            --evidence-out evidence.json \
            --allow-fallback

      - name: Render release report and rebuild dashboard
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_dashboard.py \
            --analysis-dir analysis \
            --dashboard docs/risk-dashboard.md \
            --release-json "analysis/${{ steps.meta.outputs.tag }}.json" \
            --release-md "analysis/${{ steps.meta.outputs.tag }}.md"

      - name: Attach analysis to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.meta.outputs.tag }}" \
            "analysis/${{ steps.meta.outputs.tag }}.json" \
            "analysis/${{ steps.meta.outputs.tag }}.md" \
            --clobber

      - name: Job summary
        shell: bash
        run: |
          {
            echo "## Release Risk Analysis — ${{ steps.meta.outputs.tag }}";
            echo "";
            cat "analysis/${{ steps.meta.outputs.tag }}.md";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ docs/risk-dashboard.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add release risk analysis for ${{ steps.meta.outputs.tag }}"
            git push
          fi
