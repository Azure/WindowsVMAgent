name: Release Risk & Compatibility Analysis

# Runs when a release is published (pre-release or latest) and analyzes the
# release's signed zip package. The pipeline only downloads the latest package
# and the one before it, unpacks them, and then hands everything to an LLM-based
# agent (Claude Code). There are no bespoke analysis programs in this repo: the
# agent loads the `release-risk-analysis` skill, connects to an off-the-shelf
# filesystem MCP server, and writes+runs whatever scripts it needs on each run to
# enumerate detection technologies, gather evidence about every binary (signing
# certificate, PE/.NET metadata, Rust/native binaries, OS imports, Rust compiler
# / OS supportability, diff vs. the previous release), produce a structured,
# schema-validated risk assessment, persist it under analysis/, and regenerate
# the aggregate dashboard under docs/.

on:
  release:
    types: [published, released, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to analyze (for manual / back-fill runs)."
        required: true
        type: string

# Only one analysis per tag at a time; re-publishes of the same tag are coalesced.
concurrency:
  group: release-analysis-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write # commit analysis results + dashboard back to the repo

env:
  # Model the agent runs as; also recorded in the analysis output. Adjust to any
  # model your ANTHROPIC_API_KEY can access (e.g. an alias like "opus").
  CLAUDE_MODEL: claude-opus-4-8

jobs:
  analyze:
    # Signing inspection is highest-fidelity on Windows (Get-AuthenticodeSignature).
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node is used to install the Claude Code CLI and to run the off-the-shelf
      # filesystem MCP server via npx.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Provides `rustc -vV` (release, host triple, LLVM) so the agent's Rust
      # supportability check can cross-reference the compiler against OS info.
      - name: Set up Rust toolchain (for rustc/OS supportability info)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Claude Code CLI
        shell: bash
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Fetch this release's metadata (works for both release + dispatch events).
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > release.json
          PRERELEASE=$(jq -r '.prerelease' release.json)
          NAME=$(jq -r '.name // .tag_name' release.json)
          PUBLISHED=$(jq -r '.published_at // empty' release.json)
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

          # Save the release body (change list) to a file for the agent.
          jq -r '.body // ""' release.json > release-body.md

          # Deterministically pick the previous release (by published date) as baseline.
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          PREV_TAG=$(jq -r --arg tag "$TAG" '
            [ .[] | select(.tag_name != $tag) ]
            | sort_by(.published_at) | reverse | .[0].tag_name // empty' releases.json)
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Analyzing $TAG (prerelease=$PRERELEASE), baseline=${PREV_TAG:-none}"

      # The pipeline only downloads the two packages (latest + the one before);
      # all evidence gathering is delegated to the agent.
      - name: Download current release zip assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/current work/current_zip
          mapfile -t URLS < <(jq -r '.assets[] | select(.name | endswith(".zip")) | .url' release.json)
          if [ "${#URLS[@]}" -eq 0 ]; then
            echo "::warning::No .zip asset found on release ${{ steps.meta.outputs.tag }}"
          fi
          for url in "${URLS[@]}"; do
            fname=$(basename "$url")
            gh api -H "Accept: application/octet-stream" "$url" > "work/current_zip/${fname}.zip"
          done

      - name: Download previous release zip assets
        if: steps.meta.outputs.previous_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/previous work/previous_zip
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${{ steps.meta.outputs.previous_tag }}" > prev-release.json
          mapfile -t URLS < <(jq -r '.assets[] | select(.name | endswith(".zip")) | .url' prev-release.json)
          for url in "${URLS[@]}"; do
            fname=$(basename "$url")
            gh api -H "Accept: application/octet-stream" "$url" > "work/previous_zip/${fname}.zip"
          done

      - name: Unpack zip packages
        shell: bash
        run: |
          set -euo pipefail
          for z in work/current_zip/*.zip; do
            [ -e "$z" ] || continue
            unzip -o -q "$z" -d work/current
          done
          if [ -d work/previous_zip ]; then
            for z in work/previous_zip/*.zip; do
              [ -e "$z" ] || continue
              unzip -o -q "$z" -d work/previous
            done
          fi

      # Fully agentic analysis: Claude Code loads the release-risk-analysis skill
      # (.claude/skills/), gets structured file access via the filesystem MCP
      # server (.mcp.json), and writes+runs its own evidence-collection scripts to
      # emit the schema-validated report, the Markdown report, and the dashboard.
      - name: Run agentic risk analysis (Claude Code + skill + MCP)
        if: env.ANTHROPIC_API_KEY != ''
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVIDENCE_CURRENT_DIR: work/current
          EVIDENCE_PREVIOUS_DIR: ${{ steps.meta.outputs.previous_tag != '' && 'work/previous' || '' }}
          EVIDENCE_TAG: ${{ steps.meta.outputs.tag }}
          EVIDENCE_PREVIOUS_TAG: ${{ steps.meta.outputs.previous_tag }}
          EVIDENCE_RELEASE_NAME: ${{ steps.meta.outputs.name }}
          EVIDENCE_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          EVIDENCE_PUBLISHED_AT: ${{ steps.meta.outputs.published }}
          EVIDENCE_BODY_FILE: release-body.md
          EVIDENCE_MODEL: ${{ env.CLAUDE_MODEL }}
          EVIDENCE_OUTPUT_JSON: analysis/${{ steps.meta.outputs.tag }}.json
          EVIDENCE_OUTPUT_MD: analysis/${{ steps.meta.outputs.tag }}.md
          EVIDENCE_DASHBOARD: docs/risk-dashboard.md
        run: |
          set -euo pipefail
          mkdir -p analysis
          claude \
            --print \
            --model "$CLAUDE_MODEL" \
            --mcp-config .mcp.json \
            --permission-mode bypassPermissions \
            --max-turns 80 \
            "Analyze this Windows VM Agent release using the \`release-risk-analysis\` skill at .claude/skills/release-risk-analysis/SKILL.md. All inputs are provided via the EVIDENCE_* environment variables. Follow the skill exactly: enumerate the applicable detection technologies, then write and run whatever scripts you need (PowerShell is preferred on this Windows runner) to collect deterministic evidence from the unpacked packages, diff against the previous release when one exists, and assess Rust compiler / OS supportability. Then write the schema-valid JSON report to \$EVIDENCE_OUTPUT_JSON, the Markdown report to \$EVIDENCE_OUTPUT_MD, and regenerate the aggregate dashboard at \$EVIDENCE_DASHBOARD from all analysis/*.json files. Validate the JSON against schema/analysis.schema.json and delete any throwaway helper scripts before finishing. Only create or modify those output files — do not run git commit or git push."

      # No API key configured: write a minimal placeholder report (no LLM, no
      # Python) so the dashboard step and release attachment still succeed.
      - name: Fallback placeholder report (no ANTHROPIC_API_KEY)
        if: env.ANTHROPIC_API_KEY == ''
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          echo "::warning::ANTHROPIC_API_KEY is not set; writing a placeholder analysis without running the agent."
          mkdir -p analysis
          GEN=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SUMMARY="Automated agent analysis was skipped because ANTHROPIC_API_KEY is not configured. No risk assessment was produced for this release."
          jq -n \
            --arg tag "$TAG" \
            --argjson prerelease "${PRERELEASE:-false}" \
            --arg gen "$GEN" \
            --arg summary "$SUMMARY" \
            '{
              schemaVersion: "1.0",
              tag: $tag,
              prerelease: $prerelease,
              generatedAt: $gen,
              model: "none (fallback)",
              overallRisk: "Info",
              summary: $summary,
              findings: [
                {
                  category: "Other",
                  severity: "Info",
                  finding: "Analysis skipped",
                  rationale: "ANTHROPIC_API_KEY is not configured, so the agentic analysis did not run.",
                  recommendation: "Configure the ANTHROPIC_API_KEY Actions secret and re-run the workflow to produce a full risk assessment."
                }
              ]
            }' > "analysis/${TAG}.json"
          {
            echo "# Release Risk Analysis — ${TAG}";
            echo "";
            echo "**Overall risk:** Info";
            echo "";
            echo "$SUMMARY";
          } > "analysis/${TAG}.md"

      - name: Attach analysis to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.meta.outputs.tag }}" \
            "analysis/${{ steps.meta.outputs.tag }}.json" \
            "analysis/${{ steps.meta.outputs.tag }}.md" \
            --clobber

      - name: Job summary
        shell: bash
        run: |
          {
            echo "## Release Risk Analysis — ${{ steps.meta.outputs.tag }}";
            echo "";
            cat "analysis/${{ steps.meta.outputs.tag }}.md";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ docs/risk-dashboard.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add release risk analysis for ${{ steps.meta.outputs.tag }}"
            git push
          fi
